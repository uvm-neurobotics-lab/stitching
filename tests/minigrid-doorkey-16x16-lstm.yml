#
# Like minigrid-doorkey-16x16.yml, but with an LSTM policy (RecurrentPPO), so the agent can remember the key and door
# once they leave its 7x7 view. Also gentler PPO updates (fewer epochs, larger minibatches, target_kl) to stop the
# policy collapsing after it finds the goal, more parallel envs, and a longer discount horizon. A constant learning
# rate and a small entropy coefficient (the count bonus drives exploration instead) so the policy can become decisive,
# per-episode visit counts, and a second, stochastic evaluation alongside the deterministic one.
#
# Like minigrid-doorkey.yml, but on MiniGrid-DoorKey-16x16-v0 with a count-based exploration bonus. Vanilla PPO does
# not find the sparse reward in a room this large; the bonus (count_bonus / sqrt(visits) per step, training only)
# pays it to explore positions, pick up the key, and open the door.
#
# Original description: PPO on MiniGrid-DoorKey-6x6-v0, using the 7x7x3 symbolic observation and a small ConvNet trained from
# scratch. A sparse-reward task which may be difficult for PPO to train from scratch without some exploration reward.
# Hence why ent_coef is set to 0.01.
#
# The conv stack reproduces the extractor from the Minigrid docs (three 2x2 convolutions, no padding, no pooling,
# ReLU) using this repo's own ConvNet, so no new architecture is needed. On a 7x7 input the spatial size shrinks
# 7 -> 6 -> 5 -> 4, ending at [64, 4, 4]; the VectorHead's 4x4 pooling is then an identity, which makes its final
# layer exactly Linear(64*4*4, features_dim) followed by a ReLU.
#
# Hyperparameters are RL Zoo's tuned MiniGrid PPO values; see src/rl/hyperparams.py.
#

trunk:
  Assembly:
    parts:
    - Net:
        model_name: convnet
        pretrained: false
        x_dim: 3                  # Symbolic channels: (OBJECT_IDX, COLOR_IDX, STATE).
        num_blocks: 3
        num_filters: [16, 32, 64]
        num_conv_per_block: 1
        kernel_size: 2
        stride: 1
        padding: 0
        pool_size: null           # conv_block only adds a MaxPool if this is set.
        norm_type: null           # Likewise for normalization; the BabyAI reference extractor has none.
        in_format: img
        out_format: img
    head:
      VectorHead:
        pooled_size: [4, 4]       # NOTE: We are not actually doing any pooling here, it's already this size.
        activation: relu

policy:
  features_dim: 64
  net_arch: {pi: [64, 64], vf: [64, 64]}
  activation_fn: tanh
  normalize_images: false       # Symbolic indices are not pixels; do not divide them by 255.

save_checkpoints: true
eval_checkpoints: true
device: cpu                     # PPO on a network this small is faster on CPU than on GPU.

train_config:
  # Environment (this is what replaces `dataset` in a supervised config)
  benchmark: minigrid
  env: MiniGrid-DoorKey-16x16-v0
  obs_mode: symbolic
  n_envs: 16
  vec_env: dummy                # Stepping is cheap here, so worker subprocesses would only add overhead.

  # General Params
  seed: 12345
  total_timesteps: 20000000

  # Reporting, all counted in environment steps and rounded up to whole rollouts.
  eval_freq: 250000
  save_freq: 2500000

  # Algorithm
  algo: RecurrentPPO
  algo_args:
    n_steps: 128                # One rollout is n_envs * n_steps = 2048 environment steps.
    batch_size: 256
    n_epochs: 4                 # Passes over each rollout, not environment steps.
    gamma: 0.995
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.001
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.02             # Stop an update's epochs early if the policy moves too far (SB3 uses 1.5x this).

  # Exploration
  # Coefficient of the count-based exploration bonus; 0 turns it off. Episodic counts never decay, so this is smaller
  # than the 0.005 used with lifetime counts: a random policy collects ~1.2 per episode at 0.001, vs. 6 at 0.005,
  # which would dwarf the extrinsic reward (at most 1) and make reaching the goal (which ends the episode) a loss.
  count_bonus: 0.001
  count_bonus_episodic: true    # Reset the visit counts every episode, rewarding coverage of the current layout.

  # Optimization
  optimizer: Adam
  optimizer_args:
    lr: 2.5e-4
    eps: 1.0e-5
  lr_schedule: constant

  # Evaluation
  stochastic_eval: true         # Also evaluate the sampled policy, on the same layouts.
  n_eval_episodes: 20
  n_eval_envs: 1
