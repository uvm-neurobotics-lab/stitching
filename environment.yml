name: stitch
channel_priority: strict  # Only look in conda-forge when not available in defaults.
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - jupyter
  - seaborn
  - tqdm
  - pytest
  - scipy  # only needed for the Flowers102 and SVHN datasets
  - tabulate
  - torchtnt  # only for FLOP counts in the analysis notebooks
  - h5py  # only needed for the PCAM dataset
  - gdown  # only needed for the PCAM dataset
  - wandb  # optional
  - pip:
      - torch
      - torchvision
      - pyyaml-include  # optional
      - timm  # optional
      - wilds  # only needed for WILDS datasets
      - huggingface_hub  # for the SatlasPretrain model
      - gymnasium  # only needed for RL training
      - minigrid  # only needed for RL training on MiniGrid/BabyAI
      - stable-baselines3>=2.4  # only needed for RL training; 2.4 is the floor for Gymnasium 1.0 support
      - moviepy  # only needed to record videos of a policy with rl_render.py
